services:
  paperplane:
    build: .
    container_name: paperplane
    restart: unless-stopped
    environment:
      PAPERPLANE_STORAGE_DIR: /data
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - paperplane_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  paperplane_data:
